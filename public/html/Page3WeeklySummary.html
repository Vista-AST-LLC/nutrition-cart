<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/Page3WeeklySummary.css">
    <title>Nutrition Cart</title>
    <meta name="description" content="Website companion of Vista-AST's Nutrition Cart">
    <script type="module" src="../js/Page3WeeklySummary.mjs" defer></script>
</head>

<body>
    <div class="container">
        <!--Nav-->
        <div class="nav">
            <div id="one">
                <h1>🍎 Nutrition Tracker</h1>
                <div class="subtitle">Track your daily nutrition intake with ease</div>
            </div>
            <div id="two">
                <ul>
                    <li><a href='../index.html'>Home</a></li>
                    <li><a href="../html/Page2Activity.html">Activity</a></li>
                    <li><a href="../html/Page3WeeklySummary.html">Weekly Summary</a></li>
                </ul>
            </div>
        </div>

        <main>
            <div class="card">
                <!--Page Header-->
                <div class="page-title">
                    <h2>Weekly Summary</h2>
                </div>
                <div class="weekly-avg" id="weeklyAvg"></div>
                <div class="container-for-submit-button">
                    <input type="text" class="username-input" id="userName"
                        placeholder="Enter your Name" aria-describedby="codeHelp">
                    <button class="basic-button rainbow" id="submitGrade" style="width: 175px; margin: 10px;">Submit to leaderboard</button>
                </div>
                <div id="calendar">
                    <table>
                        <thead>
                            <tr class="sum-header">
                                <th id="monHead">
                                    Monday
                                </th>
                                <th id="tuesHead">
                                    Tuesday
                                </th>
                                <th id="wedHead">
                                    Wednesday
                                </th>
                                <th id="thursHead">
                                    Thursday
                                </th>
                                <th id="friHead">
                                    Friday
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td id='monday'>
                                    <div class="day-container">
                                        <div class="points-display">
                                            <div class="points-circle" id="mondayGrade"></div>
                                            <div class="points-label" id="mondayScore"></div>
                                        </div>
                                        <div class="day-comments">
                                            <div id="mondayComments"></div>
                                        </div>
                                    </div>
                                </td>
                                <td id='tuesday'>
                                    <div class="day-container">
                                        <div class="points-display">
                                            <div class="points-circle" id="tuesdayGrade"></div>
                                            <div class="points-label" id="tuesdayScore"></div>
                                        </div>
                                        <div class="day-comments">
                                            <div id="tuesdayComments"></div>
                                        </div>
                                    </div>
                                </td>
                                <td id='wednesday'>
                                    <div class="day-container">
                                        <div class="points-display">
                                            <div class="points-circle" id="wednesdayGrade"></div>
                                            <div class="points-label" id="wednesdayScore"></div>
                                        </div>
                                        <div class="day-comments">
                                            <div id="wednesdayComments"></div>
                                        </div>
                                    </div>
                                </td>
                                <td id='thursday'>
                                    <div class="day-container">
                                        <div class="points-display">
                                            <div class="points-circle" id="thursdayGrade"></div>
                                            <div class="points-label" id="thursdayScore"></div>
                                        </div>
                                        <div class="day-comments">
                                            <div id="thursdayComments"></div>
                                        </div>
                                    </div>
                                </td>
                                <td id='friday'>
                                    <div class="day-container">
                                        <div class="points-display">
                                            <div class="points-circle" id="fridayGrade"></div>
                                            <div class="points-label" id="fridayScore"></div>
                                        </div>
                                        <div class="day-comments">
                                            <div id="fridayComments"></div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

</body>

</html>
